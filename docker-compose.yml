services:
  postgres:
    image: postgres:16
    container_name: your-next-read-postgres
    environment:
      POSTGRES_DB: your-next-read
      POSTGRES_USER: your-next-read
      POSTGRES_PASSWORD: your-next-read
    ports:
      - "5432:5432"
    volumes:
      - your-next-read-data:/var/lib/postgresql/data

volumes:
  your-next-read-data: